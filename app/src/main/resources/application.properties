spring.application.name=bar
server.port=8080

# Mesmo banco criado pelo scripts/rodar_tudo.ps1.
# Pode ser sobrescrito por variáveis de ambiente: DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:bd2026}

# O schema e os dados vêm dos arquivos de sql/, não da aplicação.
spring.sql.init.mode=never

# Não falhar na subida se o banco ainda não estiver no ar; o erro aparece na página.
spring.datasource.hikari.initialization-fail-timeout=-1

spring.thymeleaf.cache=false
spring.datasource.hikari.connection-timeout=5000
