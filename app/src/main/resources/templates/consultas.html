<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Consultas')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
    <h1>Consultas</h1>
    <p class="sub">Cada consulta é executada no banco ao abrir a aba. O SQL executado aparece abaixo do resultado.</p>

    <nav class="abas" th:each="etapa : ${ {'03', '04'} }">
        <span class="rotulo" th:text="'Etapa ' + ${etapa}"></span>
        <th:block th:each="c, i : ${consultas}" th:if="${c.etapa == etapa}">
            <a th:href="@{/consultas/{id}(id=${c.id})}"
               th:text="${i.count} + '. ' + ${c.titulo}"
               th:classappend="${c.id == consulta.id} ? 'ativo'"></a>
        </th:block>
    </nav>

    <section class="card">
        <h2 th:text="${consulta.titulo}"></h2>
        <p class="nota" th:text="${consulta.descricao}"></p>
        <div class="tags">
            <span class="tag" th:each="r : ${consulta.recursos}" th:text="${r}"></span>
        </div>

        <div class="alerta erro" th:if="${erro}" th:text="${erro}" role="alert"></div>
        <th:block th:if="${resultado}">
            <th:block th:replace="~{fragments :: resultado(${resultado})}"></th:block>
        </th:block>
    </section>

    <section class="card">
        <h2>SQL</h2>
        <pre class="sql" th:text="${consulta.sql}"></pre>
    </section>
</main>
</body>
</html>
