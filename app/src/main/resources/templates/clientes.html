<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
    <h1>Clientes</h1>
    <p class="sub">Cada cliente grava em PESSOA, CLIENTE e TELEFONE numa única transação.</p>

    <th:block th:replace="~{fragments :: mensagens}"></th:block>

    <section class="card">
        <h2 th:text="${edicao} ? 'Alterar cliente ' + ${form.nome} : 'Novo cliente'">Novo cliente</h2>
        <form th:action="@{/clientes/salvar}" method="post">
            <input type="hidden" name="edicao" th:value="${edicao}">
            <div class="form-grade">
                <div>
                    <label for="cpf">CPF (11 dígitos)</label>
                    <input id="cpf" name="cpf" required pattern="\d{11}" maxlength="11" inputmode="numeric"
                           th:value="${form.cpf}" th:readonly="${edicao}">
                </div>
                <div>
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" maxlength="80" required th:value="${form.nome}">
                </div>
                <div>
                    <label for="rua">Rua</label>
                    <input id="rua" name="rua" maxlength="80" th:value="${form.rua}">
                </div>
                <div>
                    <label for="numero">Número</label>
                    <input id="numero" name="numero" maxlength="10" th:value="${form.numero}">
                </div>
                <div>
                    <label for="bairro">Bairro</label>
                    <input id="bairro" name="bairro" maxlength="50" th:value="${form.bairro}">
                </div>
                <div>
                    <label for="cep">CEP</label>
                    <input id="cep" name="cep" maxlength="9" placeholder="00000-000" th:value="${form.cep}">
                </div>
                <div>
                    <label for="telefones">Telefones (separe com vírgula)</label>
                    <input id="telefones" name="telefones" placeholder="81988880000, 8133330000"
                           th:value="${form.telefones}">
                </div>
                <div>
                    <label for="dataPrimeiraVisita">Primeira visita</label>
                    <input id="dataPrimeiraVisita" name="dataPrimeiraVisita" type="date" required
                           th:value="${form.dataPrimeiraVisita}">
                </div>
                <div>
                    <label class="check">
                        <input type="checkbox" name="fidelidadeAtiva" value="true" th:checked="${form.fidelidadeAtiva}">
                        Fidelidade ativa
                    </label>
                </div>
            </div>
            <div class="botoes">
                <button class="btn primario" type="submit" th:text="${edicao} ? 'Salvar alterações' : 'Inserir'">Inserir</button>
                <a class="btn" th:if="${edicao}" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Clientes cadastrados</h2>
        <p class="nota">Clientes com atendimentos registrados não podem ser excluídos (chave estrangeira em ATENDIMENTO).</p>
        <div class="tabela-wrap">
            <table>
                <thead>
                <tr>
                    <th>CPF</th>
                    <th>Nome</th>
                    <th>Endereço</th>
                    <th>Telefones</th>
                    <th>Primeira visita</th>
                    <th>Fidelidade</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.cpf}"></td>
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.rua == null ? '-' : c.rua + (c.numero != null ? ', ' + c.numero : '') + (c.bairro != null ? ' - ' + c.bairro : '')}"></td>
                    <td th:text="${c.telefones.isEmpty()} ? '-' : ${c.telefones}"></td>
                    <td th:text="${#temporals.format(c.dataPrimeiraVisita, 'dd/MM/yyyy')}"></td>
                    <td th:text="${c.fidelidadeAtiva} ? 'Sim' : 'Nao'"></td>
                    <td class="acoes">
                        <a class="btn pequeno" th:href="@{/clientes(editar=${c.cpf})}">Editar</a>
                        <form th:action="@{/clientes/{cpf}/excluir(cpf=${c.cpf})}" method="post"
                              onsubmit="return confirm('Excluir este cliente (e a pessoa/telefones)?');">
                            <button class="btn pequeno perigo" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="contagem" th:text="${clientes.size()} + ' cliente(s)'"></p>
    </section>
</main>
</body>
</html>
